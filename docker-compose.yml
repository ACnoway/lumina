# Docker Compose: 全部容器化，仅通过 Nginx 暴露一个入口端口
# 用法：cp .env.example .env && docker-compose up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: lumina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumina_password}
      POSTGRES_DB: ${POSTGRES_DB:-lumina}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lumina}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lumina

  redis:
    image: redis:7-alpine
    container_name: lumina-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lumina

  minio:
    image: minio/minio:latest
    container_name: lumina-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-lumina_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-lumina_minio_secret}
    volumes:
      - ./minio_data:/data
    networks:
      - lumina

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: lumina-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-lumina}:${POSTGRES_PASSWORD:-lumina_password}@postgres:5432/${POSTGRES_DB:-lumina}?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-lumina_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-lumina_minio_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-lumina-images}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-"Lumina <noreply@example.com>"}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_this_password}
      INITIAL_BALANCE: ${INITIAL_BALANCE:-10.00}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      BACKEND_PORT: 3001
    # ports:
    #   - '3001:3001'  # 如需直接访问 API / Swagger，取消注释
    networks:
      - lumina

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        BACKEND_URL: http://backend:3001
    container_name: lumina-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - lumina

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: lumina-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
      - minio
    ports:
      - '${FRONTEND_PORT:-3000}:80'
    networks:
      - lumina

networks:
  lumina:
    name: lumina-network
